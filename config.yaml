default:
  listen: 8090
  # 运行模式: debug / release
  mode: release
  push_kubernetes: false
  push_images: false

server:
  # pixiuctl 二进制下载地址
  download_dir: /tmp/pixiuctl
  harbor:
    url: https://registry.pixiuio.com
    namespace: chartrepo
    # 敏感凭据建议通过环境变量注入，避免明文入库:
    #   RAINBOW_HARBOR_USERNAME / RAINBOW_HARBOR_PASSWORD
    username: ""
    password: ""
  auth:
    # 认证凭据，通过环境变量注入:
    #   RAINBOW_AUTH_ACCESS_KEY / RAINBOW_AUTH_SECRET_KEY
    access_key: ""
    secret_key: ""
  # JWT 签名密钥（后续登录认证使用），通过环境变量注入: RAINBOW_JWT_KEY
  jwt_key: ""

# 守护进程
rainbowd:
  name: test-name
  template_dir: /tmp/plugin
  data_dir: /tmp
  agent_image: swr.cn-north-4.myhuaweicloud.com/pixiu-public/rainbow-agent:v1.1
  nodes:
    - name: test-name
      host: kirin

agent:
  name: agent-dev
  data_dir: /tmp
  retain_days: 5

rocketmq:
  name_servers:
    - 127.0.0.1:8080
  group_name: test
  topic: test
  credential:
    # 通过环境变量注入: RAINBOW_ROCKETMQ_ACCESS_KEY / RAINBOW_ROCKETMQ_SECRET_KEY
    access_key: ""
    secret_key: ""

plugin:
  callback: http://127.0.0.1:8090
  task_id: 20220801
  synced: true
  driver: docker #skopeo or docker

build:
  callback: http://127.0.0.1:8090
  build_id: 20220801
  arch: linux/amd64
  repo: nginx:v1

rate_limit:
  user_rate_limit:
    ## 最大存储客户端IP数量
    cap: 200
    ## 单个客户端IP最大令牌数
    capacity: 100
    ## 每次补充令牌数
    quantum: 20
  normal_rate_limit:
    max_requests: 1000
  special_rate_limit:
    rate_limited_path:
      - "/rainbow/search"
    max_requests: 100

mysql:
  host: peng
  user: root
  # 通过环境变量注入: RAINBOW_MYSQL_PASSWORD
  password: ""
  port: 3306
  name: rainbow

redis:
  addr: redis:6379
  username: ""
  # 通过环境变量注入: RAINBOW_REDIS_PASSWORD
  password: ""
  db: 0

registry:
  repository: harbor.cloud.pixiuio.com
  namespace: pixiucloud
  # 通过环境变量注入: RAINBOW_REGISTRY_USERNAME / RAINBOW_REGISTRY_PASSWORD
  username: ""
  password: ""

kubernetes:
  version: v1.23.6

images:
  - name: nginx
    id: 20220801
    path: docker.io/nginx
    tags:
      - latest
      - v1.0.1
