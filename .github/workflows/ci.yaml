name: Tests

on:
  push:
    branches:
      - master
  pull_request:

env:
  GO_VERSION: '1.25'

jobs:
  golang-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run go fmt test
        run: hack/verify-gofmt.sh

      - name: Build all binaries
        # cmd/ 下为多个独立 main 文件（server/agent/builder/plugin/pixiuctl），需逐个构建
        run: |
          for f in cmd/*.go; do
            echo "building $f"
            go build -o /dev/null "$f"
          done

      - name: Run go vet（排除 cmd 多 main 包）
        run: go vet $(go list ./... | grep -v 'github.com/caoyingjunz/rainbow/cmd$')

      - name: Run unit tests
        run: go test $(go list ./... | grep -v 'github.com/caoyingjunz/rainbow/cmd$')

      - name: Run golangci-lint（含 gosec 安全扫描）
        uses: golangci/golangci-lint-action@v6
        with:
          args: --enable gosec

      - name: Run govulncheck（依赖漏洞扫描）
        run: go run golang.org/x/vuln/cmd/govulncheck@latest $(go list ./... | grep -v 'github.com/caoyingjunz/rainbow/cmd$')
